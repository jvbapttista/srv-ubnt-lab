services:
  db:
    image: mariadb:11
    restart: unless-stopped
    # Flags recomendadas oficialmente pelo Nextcloud para o MariaDB
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - db-data:/var/lib/mysql              # dados do banco, persistem entre recriações do container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  app:
    image: nextcloud:apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"                           # host:container — acessa em http://IP:8080
    volumes:
      - nc-data:/var/www/html               # arquivos, configuração e dados do Nextcloud
    environment:
      MYSQL_HOST: db                        # nome do serviço acima — resolvido pela rede interna do Compose
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # Provisiona o admin automaticamente na primeira subida — evita o assistente
      # manual de instalação, mantendo o deploy repetível/documentado.
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      # Sem isso, o Nextcloud recusa requisições vindas de qualquer nome/IP que não
      # seja "confiável" (proteção contra ataques de Host header). Como acessamos
      # via Tailscale/LAN, não via domínio público, precisamos listar explicitamente.
      NEXTCLOUD_TRUSTED_DOMAINS: srv-ubnt-001 100.96.168.97 192.168.15.182

volumes:
  db-data:
  nc-data:
